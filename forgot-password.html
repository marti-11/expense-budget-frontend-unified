<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fizcal Funhouse - Find Your Keys</title><link rel="stylesheet" href="assets/css/decorations.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Trebuchet MS",Arial,sans-serif;color:#1b1c1c;background:#fcf9f8;background-image:radial-gradient(#ffd700 2px,transparent 2px);background-size:30px 30px}.sticker{position:fixed;font-size:58px;animation:float 3s ease-in-out infinite}.s1{top:7%;left:7%;transform:rotate(-12deg)}.s2{right:8%;bottom:10%;animation-delay:.8s}.wrap{width:min(100%,500px);text-align:center}.logo{width:100px;filter:drop-shadow(4px 4px #1b1c1c);animation:wobble 2.5s infinite}.card{margin-top:22px;padding:34px;background:#fff;border:4px solid #1b1c1c;border-radius:34px;box-shadow:10px 10px 0 #1b1c1c;transform:rotate(-.6deg)}h1{margin:0;color:#8d00d9;font-size:38px;line-height:1.05}p{font-size:17px;line-height:1.5}.field{text-align:left;margin-top:24px}label{display:block;margin:0 0 8px 10px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}input{width:100%;padding:16px 20px;border:3px solid #1b1c1c;border-radius:999px;font-size:16px;background:#f3daff;outline:none}input:focus{box-shadow:4px 4px 0 #8d00d9;transform:scale(1.01)}button{width:100%;margin-top:18px;padding:17px;border:3px solid #1b1c1c;border-radius:999px;background:#ffd700;box-shadow:5px 5px 0 #1b1c1c;font-size:19px;font-weight:900;cursor:pointer}button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #1b1c1c}#message:not(:empty){margin-top:20px;padding:14px;border:2px solid #8d00d9;border-radius:18px;background:#f3daff;font-weight:bold}.back{display:inline-block;margin-top:25px;color:#8d00d9;font-weight:900}small{display:block;margin-top:12px;color:#5e5664}@keyframes float{50%{transform:translateY(-14px) rotate(8deg)}}@keyframes wobble{50%{transform:rotate(5deg) scale(1.05)}}@media(max-width:600px){.sticker{display:none}.card{padding:26px 20px}h1{font-size:31px}}
</style></head><body><main class="wrap"><img class="logo" src="assets/images/logo.png" alt="Fizcal Funhouse"><section class="card"><h1>Lost your keys? 🕵️</h1><p>No panic! Tell us your email and the key-finding squad will send a secret rescue link.</p><form id="forgot-form"><div class="field"><label for="email">Your electronic mailbox</label><input id="email" type="email" placeholder="you@funhouse.com" autocomplete="email" required></div><button type="submit">Send the rescue key! 🚀</button></form><p id="message" role="status"></p><small>The link takes a tiny trip through the internet and expires after 30 minutes.</small><a class="back" href="login.html">← I found my keys! Back to login</a></section></main><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script>document.getElementById('forgot-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message'),b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='Sending the key squad...';try{const r=await apiRequest('/Auth/forgot-password',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim()})});m.textContent='📬 '+r.message;}catch(x){m.textContent='🙈 '+x.message;}finally{b.disabled=false;b.textContent='Send the rescue key! 🚀';}});</script><script src="assets/js/page-decorations.js"></script></body></html>
