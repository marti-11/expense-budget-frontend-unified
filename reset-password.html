<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fizcal Funhouse - New Secret Code</title><link rel="stylesheet" href="assets/css/decorations.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Trebuchet MS",Arial,sans-serif;color:#1b1c1c;background:#fcf9f8;background-image:radial-gradient(#aa30fa 1.5px,transparent 1.5px);background-size:32px 32px}.wrap{width:min(100%,500px);text-align:center}.logo{width:100px;filter:drop-shadow(4px 4px #1b1c1c)}.card{margin-top:22px;padding:34px;background:#fff;border:4px solid #1b1c1c;border-radius:34px;box-shadow:10px 10px 0 #1b1c1c;transform:rotate(.5deg)}h1{margin:0;color:#8d00d9;font-size:37px}p{font-size:17px;line-height:1.5}.field{text-align:left;margin-top:18px}label{display:block;margin:0 0 8px 10px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}input{width:100%;padding:16px 20px;border:3px solid #1b1c1c;border-radius:999px;font-size:16px;background:#fff4b8;outline:none}input:focus{box-shadow:4px 4px 0 #ffd700;transform:scale(1.01)}button{width:100%;margin-top:22px;padding:17px;border:3px solid #1b1c1c;border-radius:999px;background:#aa30fa;color:#fff;box-shadow:5px 5px 0 #1b1c1c;font-size:19px;font-weight:900;cursor:pointer}button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #1b1c1c}#message:not(:empty){margin-top:20px;padding:14px;border:2px solid #8d00d9;border-radius:18px;background:#f3daff;font-weight:bold}.back{display:inline-block;margin-top:22px;color:#8d00d9;font-weight:900}@media(max-width:600px){.card{padding:26px 20px}h1{font-size:30px}}
</style></head><body><main class="wrap"><img class="logo" src="assets/images/logo.png" alt="Fizcal Funhouse"><section class="card"><h1>New secret code! 🔐</h1><p>Choose something strong, memorable, and definitely not “password123”.</p><form id="reset-form"><div class="field"><label for="password">Fresh secret code</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></div><div class="field"><label for="confirm">Say it again</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm your secret code" required></div><button type="submit">Lock it in! 🎉</button></form><p id="message" role="status"></p><a class="back" href="login.html">← Back to the Funhouse</a></section></main><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script>document.getElementById('reset-form').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,m=document.getElementById('message'),b=e.currentTarget.querySelector('button');if(p!==document.getElementById('confirm').value){m.textContent='🤹 The passwords are not twins yet.';return;}b.disabled=true;b.textContent='Changing the locks...';try{const r=await apiRequest('/Auth/reset-password',{method:'POST',body:JSON.stringify({token:new URLSearchParams(location.search).get('token')||'',password:p})});m.textContent='🎊 '+r.message+' Taking you to login...';setTimeout(()=>location.href='login.html',1500);}catch(x){m.textContent='🙈 '+x.message;}finally{b.disabled=false;b.textContent='Lock it in! 🎉';}});</script><script src="assets/js/page-decorations.js"></script></body></html>
